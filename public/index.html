<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#102b39">
    <meta name="description" content="안암래미안 아파트 관리소식과 시설 개선 현황을 공유합니다.">
    <title>안암래미안 | 우리 단지 관리소식</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="elevator-report.css">
    <link rel="stylesheet" href="senior-mode.css">
</head>

<body>
    <header class="topbar">
        <div class="shell top-inner"><a class="brand" href="#home" aria-label="안암래미안 홈"><span
                    class="brand-symbol">A<span class="dot">.</span></span><span class="brand-copy">안암래미안<small>우리 단지
                        관리소식</small></span></a>
            <div class="top-actions"><span class="public-pill"><span class="alive"></span>입주민 누구나 열람 가능</span><button
                    type="button" class="senior-toggle" id="senior-toggle" aria-pressed="false"
                    aria-label="어르신용 큰 글씨 보기"><span class="senior-toggle-icon" aria-hidden="true">가</span><span
                        id="senior-toggle-label">큰 글씨</span></button><a href="#home" class="home-link">홈</a></div>
        </div>
    </header>
    <main id="app"></main>
    <footer class="footer">
        <div class="shell footer-inner">
            <div><strong>안암래미안</strong>
                <p>우리 아파트의 관리 현황을 알기 쉽게 공유합니다.</p>
            </div>
        </div>
    </footer>
    <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="사진 확대"><button
            class="close-lightbox" aria-label="닫기">×</button><button class="prev-lightbox" aria-label="이전 사진">‹</button>
        <figure><img id="lightbox-img" alt="">
            <figcaption id="lightbox-caption"></figcaption>
        </figure><button class="next-lightbox" aria-label="다음 사진">›</button>
    </div>
    <script src="content.js"></script>
    <script src="elevator-data.js"></script>
    <script src="elevator-report.js"></script>
    <script src="accessibility.js"></script>
    <script src="app.js"></script>
</body>

</html>
