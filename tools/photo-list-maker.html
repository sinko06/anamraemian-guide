<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>안암래미안 · 사진 등록 코드 도우미</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17362f;background:#f5f8f6}*{box-sizing:border-box}body{max-width:780px;margin:32px auto;padding:0 18px}h1{font-size:25px}p{line-height:1.65;color:#52665e}.panel{background:#fff;border:1px solid #dde8df;border-radius:16px;padding:23px;box-shadow:0 6px 20px #0b33200b}.form{display:grid;gap:15px}label{display:grid;gap:7px;font-weight:700;font-size:14px}input,textarea,button{font:inherit}input{padding:11px;border-radius:8px;border:1px solid #b7c9bf}textarea{width:100%;height:300px;white-space:pre;resize:vertical;border:1px solid #b7c9bf;border-radius:9px;padding:13px;margin-top:15px;font-family:Consolas,monospace;font-size:12px}button{background:#195740;color:#fff;border:0;padding:12px 16px;border-radius:9px;font-weight:700;cursor:pointer}button.secondary{background:#52736b}button:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.hint{font-size:13px;color:#5d7869}.status{font-size:13px;margin-top:9px}code{background:#ecf3ee;padding:1px 3px}
</style></head><body><h1>사진 등록 코드 도우미</h1><p>사진 20장씩 손으로 코드를 작성하지 않도록 도와주는 <strong>오프라인</strong> 도구입니다. 사진을 서버로 전송하지 않습니다.</p><div class="panel"><div class="form"><label>동 이름<input id="building" value="101동" placeholder="예: 101동"></label><label>사진 여러 장 선택<input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple></label><label>사진 설명 앞부분 (선택)<input id="prefix" value="외벽 점검" placeholder="예: 외벽 균열 점검"></label></div><div class="actions"><button id="generate">코드 생성</button><button class="secondary" id="copy" disabled>생성 코드 복사</button></div><p class="hint">선택한 사진 파일들을 직접 <code>public/assets/photos</code> 폴더에 복사하고, 이름이 겹치지 않도록 확인하세요. 생성된 코드를 <code>public/content.js</code>의 <code>photos: [ ... ]</code> 안에 붙여 넣으면 됩니다.</p><textarea id="output" placeholder="코드 생성 버튼을 눌러주세요." spellcheck="false"></textarea><div class="status" id="status" role="status"></div></div><script>
const $=id=>document.getElementById(id);const collator=new Intl.Collator('ko',{numeric:true,sensitivity:'base'});
$('generate').addEventListener('click',()=>{
 const building=$('building').value.trim(),files=[...$('images').files].sort((a,b)=>collator.compare(a.name,b.name));
 if(!building||!files.length){$('status').textContent='동 이름과 사진 파일을 선택해 주세요.';return;}
 const prefix=$('prefix').value.trim();const rows=files.map((file,i)=>{
  const base=file.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
  const cap=[prefix,base].filter(Boolean).join(' · ');
  return `  { building: ${JSON.stringify(building)}, image: ${JSON.stringify('assets/photos/'+file.name)}, caption: ${JSON.stringify(cap)} }`;
 });
 $('output').value=rows.join(',\n');$('copy').disabled=false;$('status').textContent=files.length+'장 코드 생성 완료. 파일 복사도 잊지 마세요.';
});
$('copy').addEventListener('click',async()=>{
 if(!$('output').value)return;
 try{await navigator.clipboard.writeText($('output').value);$('status').textContent='복사했습니다. content.js의 photos 목록에 붙여 넣으세요.'}
 catch{ $('output').focus();$('output').select();document.execCommand('copy');$('status').textContent='텍스트가 선택되었습니다. Ctrl+C로 복사하세요.'; }
});
</script></body></html>
